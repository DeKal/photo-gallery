[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-backend"
version = "0.1.0"
description = "Backend for the photo-clustering web app"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "pgvector",
    "pydantic-settings",
    "pillow",
    "pillow-heif",
    "numpy",
    "open_clip_torch",
    "torch",
    "insightface",
    "onnxruntime",
    "hdbscan",
    "scikit-learn",
    "httpx",
    "pytest",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
