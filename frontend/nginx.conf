# Gateway: serve the built SPA and reverse-proxy the two backends under one
# origin. The SPA owns the root paths (BrowserRouter); the whole backend surface
# lives under /api (matching Vercel). ML + media paths go to the native worker
# on the host; everything else goes to the slim API container.
#
#   worker (native host, :8001)  <- /api/{scan,cluster,pick-folder,thumb,face-thumb,image}
#   api    (container  api:8000)  <- /api/{persons,faces,sim-clusters,photos,albums,health}
#
# Trailing-slash proxy_pass strips the /api prefix before forwarding.
# `host.docker.internal` resolves to the host because the compose service sets
# extra_hosts: ["host.docker.internal:host-gateway"].

upstream worker { server host.docker.internal:8001; }
upstream api    { server api:8000; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Larger reads for original-image streaming from the worker.
    client_max_body_size 50m;

    # --- ML + media surface -> native worker (strips /api) -------------------
    location /api/scan        { proxy_pass http://worker/scan; }
    location /api/cluster     { proxy_pass http://worker/cluster; }
    location /api/pick-folder { proxy_pass http://worker/pick-folder; }
    location /api/thumb/      { proxy_pass http://worker/thumb/; }
    location /api/face-thumb/ { proxy_pass http://worker/face-thumb/; }
    location /api/image/      { proxy_pass http://worker/image/; }

    # --- light DB surface -> api container (strips /api) ---------------------
    location /api/ { proxy_pass http://api/; }

    # --- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
