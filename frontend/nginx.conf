# Gateway: serve the built SPA and reverse-proxy the two backends under one
# origin. ML + media paths go to the native worker on the host; everything else
# goes to the slim API container on the compose network.
#
#   worker (native host, :8001)  <- /scan /cluster /pick-folder /thumb /face-thumb /image
#   api    (container  api:8000)  <- /persons /faces /sim-clusters /photos /health
#
# `host.docker.internal` resolves to the host because the compose service sets
# extra_hosts: ["host.docker.internal:host-gateway"].

upstream worker { server host.docker.internal:8001; }
upstream api    { server api:8000; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Larger reads for original-image streaming from the worker.
    client_max_body_size 50m;

    # --- ML + media surface -> native worker ---------------------------------
    location /scan        { proxy_pass http://worker; }
    location /cluster     { proxy_pass http://worker; }
    location /pick-folder { proxy_pass http://worker; }
    location /thumb/      { proxy_pass http://worker; }
    location /face-thumb/ { proxy_pass http://worker; }
    location /image/      { proxy_pass http://worker; }

    # --- light DB surface -> api container -----------------------------------
    location /persons      { proxy_pass http://api; }
    location /faces        { proxy_pass http://api; }
    location /sim-clusters { proxy_pass http://api; }
    location /photos       { proxy_pass http://api; }
    location /albums       { proxy_pass http://api; }
    location /health       { proxy_pass http://api; }

    # --- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
