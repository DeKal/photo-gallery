# Gateway for "FE + BE local, data on Neon remote" mode. There is NO native ML
# worker here, so every proxied path goes to the slim api container — including
# media, which main_api serves from the DB (thumb_data / face thumb_data).
# Mounted over the default conf by docker-compose.neon.yml. Scan/cluster/
# pick-folder are absent by design (the SPA is built with VITE_NO_WORKER=1, so
# it never calls them).

upstream api { server api:8000; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # --- media (served from the DB by main_api) ------------------------------
    location /thumb/      { proxy_pass http://api; }
    location /face-thumb/ { proxy_pass http://api; }
    location /image/      { proxy_pass http://api; }

    # --- DB surface ----------------------------------------------------------
    location /persons      { proxy_pass http://api; }
    location /faces        { proxy_pass http://api; }
    location /sim-clusters { proxy_pass http://api; }
    location /photos       { proxy_pass http://api; }
    location /albums       { proxy_pass http://api; }
    location /health       { proxy_pass http://api; }

    # --- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
