# Gateway for "FE + BE local, data on Neon remote" mode. The slim api container
# serves the DB surface AND media (from thumb_data). Scanning is optional: if
# you run the native ML worker on the host (pointed at Neon), its scan/cluster/
# folder-picker routes are proxied below; media still comes from the DB via api.
# Mounted over the default conf by docker-compose.neon.yml.

upstream api    { server api:8000; }
# Native ML worker on the host (optional; only needed to Scan). Resolves via
# extra_hosts: ["host.docker.internal:host-gateway"] on the frontend service.
upstream worker { server host.docker.internal:8001; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # The SPA now owns the root paths (BrowserRouter), so the whole backend
    # surface lives under /api — matching the Vercel deploy. Trailing-slash
    # proxy_pass strips the /api prefix before forwarding.

    # --- scan surface -> native worker (host :8001) --------------------------
    location /api/scan        { proxy_pass http://worker/scan; }
    location /api/cluster     { proxy_pass http://worker/cluster; }
    location /api/pick-folder { proxy_pass http://worker/pick-folder; }

    # --- media + DB surface -> api (strips /api) -----------------------------
    location /api/ { proxy_pass http://api/; }

    # --- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
