# Gateway for "FE + BE local, data on Neon remote" mode. The slim api container
# serves the DB surface AND media (from thumb_data). Scanning is optional: if
# you run the native ML worker on the host (pointed at Neon), its scan/cluster/
# folder-picker routes are proxied below; media still comes from the DB via api.
# Mounted over the default conf by docker-compose.neon.yml.

upstream api    { server api:8000; }
# Native ML worker on the host (optional; only needed to Scan). Resolves via
# extra_hosts: ["host.docker.internal:host-gateway"] on the frontend service.
upstream worker { server host.docker.internal:8001; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # --- scan surface -> native worker (host :8001) --------------------------
    location /scan        { proxy_pass http://worker; }
    location /cluster     { proxy_pass http://worker; }
    location /pick-folder { proxy_pass http://worker; }

    # --- media (served from the DB by main_api) ------------------------------
    location /thumb/      { proxy_pass http://api; }
    location /face-thumb/ { proxy_pass http://api; }
    location /image/      { proxy_pass http://api; }

    # --- DB surface ----------------------------------------------------------
    location /persons      { proxy_pass http://api; }
    location /faces        { proxy_pass http://api; }
    location /sim-clusters { proxy_pass http://api; }
    location /photos       { proxy_pass http://api; }
    location /albums       { proxy_pass http://api; }
    location /health       { proxy_pass http://api; }

    # --- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
